[project]
name = "failsight"
version = "0.0.1"
description = "Local-first observability and resilience for multi-agent AI workflows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
failsight = "failsight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/failsight"]
# The built UI is git-ignored, so it must be force-included as an artifact.
artifacts = ["src/failsight/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
